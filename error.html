<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <link rel="stylesheet" href="/stylesheets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.6.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="w-full min-h-screen bg-zinc-900 text-white flex flex-col items-center justify-center px-4">
    <h1 class="text-2xl font-bold"></h1>
    <h2 class="text-5xl font-light mt-4 opacity-50"></h2>
    <pre class="mt-6 text-xs opacity-30 max-w-full overflow-auto"></pre>
    <a href="/" class="mt-8 text-blue-500 text-sm">Go Home</a>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    document.querySelector("h1").textContent = params.get("message") || "Error";
    document.querySelector("h2").textContent = params.get("status") || "500";
    document.querySelector("pre").textContent = params.get("stack") || "";
  </script>
</body>
</html>
